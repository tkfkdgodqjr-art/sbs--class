<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBS컴퓨터아트학원 안산점 — 개강안내</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pink:#e8608a;--pink-dim:#d04d78;--pink-light:#fff0f5;--pink-border:#fad0de;--pink-mid:#f5b8ce;--bg:#fdf5f8;--surface:#fff;--text:#1a0a10;--text2:#7a4060;--text3:#c090a8;--border:#f0e0e8;--radius:10px;--radius-sm:6px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
.header{background:var(--pink);padding:14px 0 0;}
.header-inner{max-width:900px;margin:0 auto;padding:0 20px;}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.logo-title{font-size:17px;font-weight:900;color:#fff;letter-spacing:-0.4px;}
.logo-sub{font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px;}
.header-right{display:flex;gap:8px;align-items:center;}
.search-box{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:6px 14px 6px 12px;display:flex;align-items:center;gap:6px;}
.search-box input{background:none;border:none;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#fff;width:150px;}
.search-box input::placeholder{color:rgba(255,255,255,0.6);}
.icon-btn{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.3);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;color:#fff;font-family:'Noto Sans KR',sans-serif;cursor:pointer;font-weight:600;}
.icon-btn:hover{background:rgba(255,255,255,0.28);}
.room-bar{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:14px;}
.room-chip{height:28px;padding:0 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.18);color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.room-chip:hover{background:rgba(255,255,255,0.3);}
.room-chip.active{background:#fff;color:var(--pink);}
.content{max-width:900px;margin:0 auto;padding:20px 20px 60px;}
.tabs-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:20px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;border:1px solid var(--border);background:var(--surface);transition:all 0.15s;}
.tab-btn:hover{border-color:var(--pink-mid);color:var(--pink);}
.tab-btn.active{background:#1a0a10;color:#fff;border-color:#1a0a10;}
.tabs-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:var(--radius-sm);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;border:none;white-space:nowrap;}
.btn:active{transform:scale(0.97);}
.btn-pink{background:var(--pink);color:#fff;}
.btn-pink:hover{background:var(--pink-dim);}
.btn-outline{background:var(--surface);color:var(--pink);border:1px solid var(--pink-border);}
.btn-outline:hover{background:var(--pink-light);}
.btn-outline.on{background:var(--pink-light);border-color:var(--pink);}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--pink-mid);color:var(--pink);}
.btn-clear{background:none;border:none;color:var(--text3);font-size:12px;padding:4px 8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.toolbar{display:flex;align-items:center;margin-bottom:10px;}
.total-label{font-size:13px;color:var(--text2);}
.total-label b{color:var(--text);font-weight:700;}
.sel-badge{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text3);margin-left:12px;}
.sel-badge.on{color:var(--pink);font-weight:600;}
.list{display:flex;flex-direction:column;gap:8px;}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;}
.item:hover{border-color:var(--pink-mid);box-shadow:0 2px 10px rgba(232,96,138,0.08);}
.item.selected{border-color:var(--pink);background:var(--pink-light);box-shadow:0 0 0 1px var(--pink);}
.item-check{width:18px;height:18px;border:1.5px solid var(--pink-mid);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.item.selected .item-check{background:var(--pink);border-color:var(--pink);}
.item.selected .item-check::after{content:'✓';font-size:11px;color:#fff;font-weight:900;}
.item-badge{font-size:11px;font-weight:700;background:var(--pink);color:#fff;padding:3px 10px;border-radius:6px;flex-shrink:0;white-space:nowrap;}
.item-main{flex:1;min-width:0;}
.item-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;}
.item-info{font-size:12px;color:var(--text3);}
.item-copy{flex-shrink:0;padding:6px 14px;border-radius:var(--radius-sm);background:var(--pink-light);border:1px solid var(--pink-border);color:var(--pink);font-size:12px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.item-copy:hover{background:var(--pink);color:#fff;border-color:var(--pink);}
.item-copy.copied{background:#eafaf2;border-color:#86efac;color:#16a34a;}
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-icon{font-size:36px;margin-bottom:12px;display:block;}
.empty-title{font-size:15px;color:var(--text2);font-weight:600;margin-bottom:6px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--pink);color:#fff;padding:11px 24px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;transition:all 0.22s;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(232,96,138,0.35);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,10,16,0.45);z-index:500;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:540px;max-width:95vw;max-height:85vh;overflow-y:auto;}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:15px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:2px 8px;line-height:1;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px;}
.modal-sec{margin-bottom:22px;}
.modal-sec:last-child{margin-bottom:0;}
.modal-sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.dc-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.dc-row label{font-size:13px;font-weight:700;min-width:76px;color:var(--text);}
.dc-row input{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text2);height:30px;padding:0 10px;background:var(--bg);}
.dc-row input:focus{outline:none;border-color:var(--pink);}
.modal-field{margin-bottom:10px;}
.modal-field label{font-size:13px;font-weight:600;display:block;margin-bottom:5px;color:var(--text);}
.modal-field input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--text);height:36px;padding:0 12px;background:var(--bg);}
.modal-field input:focus{outline:none;border-color:var(--pink);}
@media(max-width:600px){.content{padding:14px 12px 50px;}.tabs-right{width:100%;justify-content:flex-end;}.search-box input{width:110px;}}
</style>
</head>

</div>

let activeTab='weekday',activeRoom='',multiMode=false,selected=new Set();
function init(){initDcList();applyFilters();}
function setTab(tab,btn){activeTab=tab;selected.clear();document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');applyFilters();}
function setRoom(room){activeRoom=room;document.querySelectorAll('.room-chip').forEach(b=>b.classList.toggle('active',b.textContent.trim()===(room||'전체')));applyFilters();}
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const f=DATA[activeTab].filter(c=>{if(activeRoom&&c.room!==activeRoom)return false;if(q&&!c.subject.toLowerCase().includes(q))return false;return true;});
  document.getElementById('total-label').innerHTML=`총 <b>${f.length}</b>개 과목`;
  renderList(f);updateSelUI();
}
function key(c){return c.subject+c.timeStart+c.room+c.startDate;}
function renderList(courses){
  const el=document.getElementById('list');
  if(!courses.length){el.innerHTML=`<div class="empty"><span class="empty-icon">🔍</span><div class="empty-title">강좌가 없습니다</div><div>검색 조건을 바꿔보세요.</div></div>`;return;}
  el.innerHTML=courses.map((c,i)=>{
    const sel=selected.has(key(c));
    const cd=JSON.stringify(c).replace(/"/g,'&quot;');
    const info=[c.days,`${c.timeStart}~${c.timeEnd}`,`${c.startDate}~${c.endDate}`,c.teacher].filter(Boolean).join(' | ');
    return `<div class="item${sel?' selected':''}" onclick="onItemClick('${key(c).replace(/'/g,"\\'")}',event)">
      <div class="item-check"></div>
      <div class="item-badge">${c.room}</div>
      <div class="item-main">
        <div class="item-name">${c.subject}</div>
        <div class="item-info">${info}</div>
      </div>
      <button class="item-copy" id="cp${i}" onclick="copyItem(event,${cd},${i})">📋 복사</button>
    </div>`;
  }).join('');
}
function onItemClick(k,e){if(!multiMode)return;if(selected.has(k))selected.delete(k);else selected.add(k);applyFilters();}
function toggleMulti(){multiMode=!multiMode;document.getElementById('multi-btn').classList.toggle('on',multiMode);if(!multiMode)selected.clear();document.getElementById('sel-copy-btn').style.display=multiMode?'':'none';document.getElementById('clear-btn').style.display=multiMode?'':'none';applyFilters();}
function clearSel(){selected.clear();applyFilters();}
function updateSelUI(){const b=document.getElementById('sel-badge');b.textContent=selected.size+'개 선택됨';b.classList.toggle('on',selected.size>0);}
function dc(room){const el=document.getElementById('dc-'+room);return el?el.value:(DISCORD[room]||'');}

function block(c){
  return `*과목명: ${c.subject}
*개강일: ${c.startDate}
*종강일: ${c.endDate}
*수업시간: ${c.timeStart}~${c.timeEnd}
*강의장 : ${c.room}
*수업: ${c.days}
*준비물 : ${c.supplies}
*비대면유/무 : ${c.isOnline}
*강사님 : ${c.teacher}
${c.room}  ${dc(c.room)}`;}

function wrap(blocks){
  const url=document.getElementById('gs-url').value;
  const notice=document.getElementById('notice-text').value;
  return `❤️ SBS 아카데미개강안내 ❤️\n${blocks.join('\n\n')}\n\n⭐️ 수강생 필독 ⭐️\n                  \n${url}\n${notice}`;}

function copyItem(e,c,i){e.stopPropagation();navigator.clipboard.writeText(wrap([block(c)])).then(()=>{const btn=document.getElementById('cp'+i);if(btn){btn.classList.add('copied');btn.textContent='✓ 복사됨';setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 복사';},1800);}toast('✅ 복사되었습니다!');});}
function copyAll(){const q=document.getElementById('search').value.toLowerCase();const f=DATA[activeTab].filter(c=>{if(activeRoom&&c.room!==activeRoom)return false;if(q&&!c.subject.toLowerCase().includes(q))return false;return true;});if(!f.length){toast('강좌가 없습니다.');return;}navigator.clipboard.writeText(wrap(f.map(block))).then(()=>toast(`✅ 전체 ${f.length}개 복사 완료!`));}
function copySelected(){const t=DATA[activeTab].filter(c=>selected.has(key(c)));if(!t.length){toast('선택된 강좌가 없습니다.');return;}navigator.clipboard.writeText(wrap(t.map(block))).then(()=>{selected.clear();applyFilters();toast(`✅ ${t.length}개 선택 복사 완료! 선택이 초기화되었습니다.`);});}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}
function initDcList(){document.getElementById('dc-list').innerHTML=Object.entries(DISCORD).map(([r,u])=>`<div class="dc-row"><label>${r}</label><input type="text" id="dc-${r}" value="${u}"></div>`).join('');}
function openModal(){document.getElementById('modal-bg').classList.add('open');}
function closeModal(e){if(!e||e.target===document.getElementById('modal-bg'))document.getElementById('modal-bg').classList.remove('open');}
init();
</script>
