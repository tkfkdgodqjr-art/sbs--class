<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBS컴퓨터아트학원 안산점 — 개강안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdf6f8;
  --surface: #ffffff;
  --surface2: #fdf0f4;
  --surface3: #fce8ef;
  --border: #f0d9e3;
  --border2: #e8c4d4;
  --text: #2d1a22;
  --text2: #7a5468;
  --text3: #b899a8;
  --yellow: #f0628a;
  --yellow-dim: #d94d75;
  --yellow-bg: rgba(240,98,138,0.07);
  --yellow-bg2: rgba(240,98,138,0.14);
  --radius: 10px;
  --radius-sm: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ── HEADER ── */
.header {
  background: #ffffff;
  border-bottom: 2px solid var(--yellow);
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 200;
}
.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 60px;
}
.logo-block { flex-shrink: 0; }
.logo-title {
  font-size: 18px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-title::before {
  content: '■';
  color: var(--yellow);
  font-size: 14px;
}
.logo-sub {
  font-size: 11px;
  color: var(--text3);
  margin-top: 1px;
  font-weight: 400;
}
.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  flex-wrap: wrap;
}

/* Search */
.search-wrap {
  position: relative;
  flex-shrink: 0;
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  font-size: 13px;
  pointer-events: none;
}
.search-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  height: 34px;
  padding: 0 10px 0 30px;
  width: 180px;
  transition: border-color 0.2s;
}
.search-input:focus { outline: none; border-color: var(--yellow); }
.search-input::placeholder { color: var(--text3); }

/* Room filter */
.room-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.room-btn {
  height: 30px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.room-btn:hover { border-color: var(--yellow); color: var(--yellow); }
.room-btn.active {
  background: var(--yellow);
  color: #fff;
  border-color: var(--yellow);
  font-weight: 700;
}

/* ── UPLOAD BAR ── */
.upload-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 28px;
}
.upload-bar-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.upload-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 16px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
}
.upload-label:hover { border-color: var(--yellow); color: var(--yellow); }
.upload-label input { display: none; }
.upload-status {
  font-size: 13px;
  color: var(--text3);
  font-family: 'IBM Plex Mono', monospace;
}
.upload-status.ok { color: #16a34a; }
.upload-status.err { color: #dc2626; }

/* ── TABS ── */
.tabs-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
}
.tabs-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  gap: 4px;
  padding: 12px 0;
}
.tab-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 22px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.tab-btn:hover { border-color: var(--border2); color: var(--text); }
.tab-btn.active {
  background: var(--yellow);
  color: #fff;
  border-color: var(--yellow);
  font-weight: 700;
}
.tab-icon { font-size: 14px; }

/* ── TOOLBAR ── */
.toolbar {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 28px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.total-count {
  font-size: 14px;
  color: var(--text2);
  font-weight: 400;
}
.total-count b { color: var(--text); font-weight: 700; }
.toolbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sel-info {
  font-size: 13px;
  color: var(--text3);
  font-family: 'IBM Plex Mono', monospace;
}
.sel-info.active { color: var(--yellow); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:active { transform: scale(0.96); }
.btn-yellow { background: var(--yellow); color: #fff; border-color: var(--yellow); }
.btn-yellow:hover { background: var(--yellow-dim); }
.btn-outline { background: transparent; color: var(--text2); border-color: var(--border2); }
.btn-outline:hover { border-color: var(--yellow); color: var(--yellow); }
.btn-ghost { background: var(--surface2); color: var(--text2); border-color: var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--border2); }
.multi-btn.on { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow); }
.btn-clear { background: transparent; color: var(--text3); border: none; font-size: 12px; padding: 4px 8px; }
.btn-clear:hover { color: var(--text2); }

/* ── GRID ── */
.grid-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 28px 40px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  position: relative;
}
.card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.card.selected {
  border-color: var(--yellow);
  box-shadow: 0 0 0 1px var(--yellow), 0 8px 24px rgba(245,196,0,0.15);
}
.card.selected::after {
  content: '✓';
  position: absolute;
  top: 10px;
  right: 52px;
  width: 20px;
  height: 20px;
  background: var(--yellow);
  color: #fff;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-header {
  padding: 14px 16px 10px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.card-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
}
.card-room-badge {
  flex-shrink: 0;
  background: var(--yellow);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 4px;
  letter-spacing: 0.03em;
}
.card-time-row {
  padding: 0 16px 10px;
  font-size: 12px;
  color: var(--text3);
  font-family: 'IBM Plex Mono', monospace;
  border-bottom: 1px solid var(--border);
}
.card-body {
  padding: 12px 16px;
}
.card-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 4px;
  margin-bottom: 5px;
  font-size: 13px;
  align-items: baseline;
}
.card-row:last-child { margin-bottom: 0; }
.card-label {
  color: var(--text3);
  font-size: 12px;
}
.card-val { color: var(--text2); }
.card-val a {
  color: var(--yellow);
  text-decoration: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  word-break: break-all;
}
.card-val a:hover { text-decoration: underline; }
.card-footer {
  padding: 10px 12px;
  border-top: 1px solid var(--border);
}
.card-copy-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.card-copy-btn:hover {
  background: var(--yellow-bg);
  border-color: var(--yellow);
  color: var(--yellow);
}
.card-copy-btn.copied {
  background: rgba(240,98,138,0.1);
  border-color: var(--yellow);
  color: var(--yellow);
}

/* ── EMPTY ── */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text3);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; display: block; opacity: 0.5; }
.empty-title { font-size: 16px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--yellow);
  color: #fff;
  padding: 11px 24px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 700;
  opacity: 0;
  transition: all 0.25s;
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SETTINGS MODAL ── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(45,26,34,0.5);
  z-index: 500;
  align-items: center;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  width: 560px;
  max-width: 95vw;
  max-height: 85vh;
  overflow-y: auto;
}
.modal-header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; padding: 2px 8px; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px; }
.modal-section { margin-bottom: 24px; }
.modal-section:last-child { margin-bottom: 0; }
.modal-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.dc-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.dc-row label { font-size: 13px; font-weight: 600; min-width: 72px; }
.dc-row input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  height: 30px;
  padding: 0 10px;
}
.dc-row input:focus { outline: none; border-color: var(--yellow); }
.modal-input-wrap { margin-bottom: 10px; }
.modal-input-wrap label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 5px; }
.modal-input-wrap input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  height: 34px;
  padding: 0 12px;
}
.modal-input-wrap input:focus { outline: none; border-color: var(--yellow); }

@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .room-filters { display: none; }
}
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .header-inner { flex-wrap: wrap; height: auto; padding: 10px 0; gap: 8px; }
  .tabs-inner { gap: 6px; overflow-x: auto; flex-wrap: nowrap; }
  .tab-btn { flex-shrink: 0; }
  .toolbar { flex-wrap: wrap; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-title">SBS컴퓨터아트학원 안산점 — 개강안내</div>
      <div class="logo-sub">과목을 선택해 메시지를 복사하세요</div>
    </div>
    <div class="header-controls">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search" type="text" placeholder="과목명 검색" oninput="applyFilters()">
      </div>
      <div class="room-filters" id="room-filters">
        <button class="room-btn active" onclick="setRoom('')">전체</button>
        <button class="room-btn" onclick="setRoom('A강의장')">A강의장</button>
        <button class="room-btn" onclick="setRoom('B강의장')">B강의장</button>
        <button class="room-btn" onclick="setRoom('C강의장')">C강의장</button>
        <button class="room-btn" onclick="setRoom('D강의장')">D강의장</button>
        <button class="room-btn" onclick="setRoom('E강의장')">E강의장</button>
        <button class="room-btn" onclick="setRoom('F강의장')">F강의장</button>
        <button class="room-btn" onclick="setRoom('G강의장')">G강의장</button>
        <button class="room-btn" onclick="setRoom('H강의장')">H강의장</button>
      </div>
      <button class="btn btn-ghost" onclick="openSettings()">⚙️ 설정</button>
    </div>
  </div>
</header>

<!-- UPLOAD BAR -->
<div class="upload-bar">
  <div class="upload-bar-inner">
    <label class="upload-label">
      📊 시간표 엑셀 업로드
      <input type="file" accept=".xls,.xlsx" onchange="handleFile(this.files[0])">
    </label>
    <span class="upload-status" id="upload-status">시간표 .xls 파일을 올리면 자동으로 강좌를 불러옵니다</span>
  </div>
</div>

<!-- TABS -->
<div class="tabs-wrap">
  <div class="tabs-inner" id="tabs-inner">
    <!-- tabs rendered by JS -->
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <span class="total-count" id="total-count">총 <b>0</b>개 과목</span>
  <div class="toolbar-right">
    <span class="sel-info" id="sel-info">0개 선택됨</span>
    <button class="btn btn-outline multi-btn" id="multi-btn" onclick="toggleMulti()">☑️ 다중선택</button>
    <button class="btn btn-yellow" onclick="copyAll()">📋 전체 복사</button>
    <button class="btn btn-ghost" id="sel-copy-btn" onclick="copySelected()" style="display:none">📋 선택 복사</button>
    <button class="btn-clear" id="clear-btn" onclick="clearSelected()" style="display:none">✕ 선택 해제</button>
  </div>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="modal-bg" onclick="closeSettings(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">⚙️ 공통 설정</span>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-title">강의장별 디스코드 링크</div>
        <div id="dc-settings"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">고정 문구</div>
        <div class="modal-input-wrap">
          <label>필독 안내 구글 시트 URL</label>
          <input type="text" id="gs-url" value="https://docs.google.com/spreadsheets/d/1qzjmoBQ0pMBvh6CcoqOBq_dT7cLGc44vKZp5bx9fwKY/edit?gid=0#gid=0">
        </div>
        <div class="modal-input-wrap">
          <label>필독 설명 문구</label>
          <input type="text" id="notice-text" value="[강의장 비대면 링크, 자습가능 강의장, 격일시간표안내, 세미나안내, 자격증 신청방법 등등]">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── DATA ──
const DISCORD_DEF = {
  'A강의장':'https://discord.gg/UbPVxWgcct',
  'B강의장':'https://discord.gg/VBaPncjxXe',
  'C강의장':'https://discord.gg/2WcQwuzvxy',
  'D강의장':'https://discord.gg/bHxVuv3AxS',
  'E강의장':'https://discord.gg/AsV8M6P79c',
  'F강의장':'https://discord.gg/cEDxpq6aVS',
  'G강의장':'https://discord.gg/KrHJzzErWt',
  'H강의장':'https://discord.gg/7x4cFMtgcn'
};
const ROOMS = Object.keys(DISCORD_DEF);

// Tab data structure: { id, label, icon, courses[] }
let tabs = [
  { id: 'weekday', label: '평일반', icon: '📅', month: '5월', courses: [] },
  { id: 'weekend', label: '주말반', icon: '🗓️', month: '5월', courses: [] }
];
let activeTab = 'weekday';
let activeRoom = '';
let multiMode = false;
let selected = new Set();
let nextId = 1;

// ── INIT ──
function init() {
  renderTabs();
  initDcSettings();
  applyFilters();
}

// ── TABS ──
function renderTabs() {
  const el = document.getElementById('tabs-inner');
  el.innerHTML = tabs.map(t => `
    <button class="tab-btn ${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">
      <span class="tab-icon">${t.icon}</span>
      ${t.month} ${t.label}
    </button>`).join('');
}

function switchTab(id) {
  activeTab = id;
  selected.clear();
  renderTabs();
  applyFilters();
}

// ── FILTERS ──
function setRoom(room) {
  activeRoom = room;
  document.querySelectorAll('.room-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === (room || '전체'));
  });
  applyFilters();
}

function applyFilters() {
  const tab = tabs.find(t => t.id === activeTab);
  if (!tab) return;
  const search = document.getElementById('search').value.toLowerCase();
  const filtered = tab.courses.filter(c => {
    if (activeRoom && c.room !== activeRoom) return false;
    if (search && !c.subject.toLowerCase().includes(search)) return false;
    return true;
  });
  renderGrid(filtered);
  document.getElementById('total-count').innerHTML = `총 <b>${filtered.length}</b>개 과목`;
  updateSelInfo();
}

// ── GRID ──
function renderGrid(courses) {
  const grid = document.getElementById('grid');
  if (courses.length === 0) {
    grid.innerHTML = `<div class="empty">
      <span class="empty-icon">📭</span>
      <div class="empty-title">강좌가 없습니다</div>
      <div>엑셀 파일을 업로드하거나 설정에서 강좌를 추가해주세요.</div>
    </div>`;
    return;
  }
  grid.innerHTML = courses.map(c => cardHTML(c)).join('');
}

function cardHTML(c) {
  const isSel = selected.has(c.id);
  const discord = getDiscord(c.room);
  const timeLabel = `${c.days} | ${c.timeStart}~${c.timeEnd}`;
  return `
  <div class="card ${isSel?'selected':''}" id="card-${c.id}" onclick="onCardClick(${c.id}, event)">
    <div class="card-header">
      <span class="card-name">${c.subject}</span>
      <span class="card-room-badge">${c.room}</span>
    </div>
    <div class="card-time-row">${timeLabel}</div>
    <div class="card-body">
      <div class="card-row"><span class="card-label">· 개강일</span><span class="card-val">${c.startDate}</span></div>
      <div class="card-row"><span class="card-label">· 종강일</span><span class="card-val">${c.endDate}</span></div>
      <div class="card-row"><span class="card-label">· 수강시간</span><span class="card-val">${c.timeStart}~${c.timeEnd}</span></div>
      <div class="card-row"><span class="card-label">· 강의실</span><span class="card-val">3층 ${c.room}</span></div>
      <div class="card-row"><span class="card-label">· 비대면링크</span><span class="card-val"><a href="${discord}" target="_blank" onclick="event.stopPropagation()">${discord}</a></span></div>
      <div class="card-row"><span class="card-label">· 대면여부</span><span class="card-val">${c.isOnline}</span></div>
    </div>
    <div class="card-footer">
      <button class="card-copy-btn" id="copybtn-${c.id}" onclick="copyCard(${c.id}, event)">
        📋 복사하기
      </button>
    </div>
  </div>`;
}

// ── CARD INTERACTIONS ──
function onCardClick(id, e) {
  if (!multiMode) return;
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  const card = document.getElementById('card-'+id);
  if (card) card.classList.toggle('selected', selected.has(id));
  updateSelInfo();
}

function copyCard(id, e) {
  e.stopPropagation();
  const tab = tabs.find(t => t.id === activeTab);
  if (!tab) return;
  const c = tab.courses.find(c => c.id === id);
  if (!c) return;
  const msg = genMsg(c);
  navigator.clipboard.writeText(msg).then(() => {
    const btn = document.getElementById('copybtn-'+id);
    if (btn) {
      btn.classList.add('copied');
      btn.textContent = '✓ 복사됨';
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '📋 복사하기'; }, 1800);
    }
    toast('✅ 복사되었습니다!');
  });
}

// ── MULTI SELECT ──
function toggleMulti() {
  multiMode = !multiMode;
  const btn = document.getElementById('multi-btn');
  btn.classList.toggle('on', multiMode);
  if (!multiMode) { selected.clear(); }
  document.getElementById('sel-copy-btn').style.display = multiMode ? '' : 'none';
  document.getElementById('clear-btn').style.display = multiMode ? '' : 'none';
  updateSelInfo();
  applyFilters();
}

function clearSelected() {
  selected.clear();
  updateSelInfo();
  applyFilters();
}

function updateSelInfo() {
  const el = document.getElementById('sel-info');
  el.textContent = selected.size + '개 선택됨';
  el.classList.toggle('active', selected.size > 0);
}

// ── COPY ──
function genMsg(c) {
  const gsUrl = document.getElementById('gs-url').value;
  const notice = document.getElementById('notice-text').value;
  const discord = getDiscord(c.room);
  return `★ SBS 아카데미개강안내 ★

*과목명: ${c.subject}
*개강일: ${c.startDate}
*종강일: ${c.endDate}
*수업시간: ${c.timeStart}~${c.timeEnd}
*강의장 : ${c.room}
*수업: ${c.days}
*준비물 : ${c.supplies}
*비대면유/무 : ${c.isOnline}
*강사님 : ${c.teacher}
${c.room}  ${discord}

★수강생 필독!!★
                  
${gsUrl}

${notice}`;
}

function copyAll() {
  const tab = tabs.find(t => t.id === activeTab);
  if (!tab || tab.courses.length === 0) { toast('강좌가 없습니다.'); return; }
  const search = document.getElementById('search').value.toLowerCase();
  const filtered = tab.courses.filter(c => {
    if (activeRoom && c.room !== activeRoom) return false;
    if (search && !c.subject.toLowerCase().includes(search)) return false;
    return true;
  });
  const text = filtered.map(c => genMsg(c)).join('\n\n' + '─'.repeat(30) + '\n\n');
  navigator.clipboard.writeText(text).then(() => toast(`✅ 전체 ${filtered.length}개 복사 완료!`));
}

function copySelected() {
  const tab = tabs.find(t => t.id === activeTab);
  if (!tab) return;
  const toGen = tab.courses.filter(c => selected.has(c.id));
  if (toGen.length === 0) { toast('선택된 강좌가 없습니다.'); return; }
  const text = toGen.map(c => genMsg(c)).join('\n\n' + '─'.repeat(30) + '\n\n');
  navigator.clipboard.writeText(text).then(() => toast(`✅ ${toGen.length}개 선택 복사 완료!`));
}

// ── EXCEL PARSE ──
function handleFile(file) {
  if (!file) return;
  setUploadStatus('⏳ 파일 읽는 중...', '');
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const bytes = new Uint8Array(e.target.result);
      const text = new TextDecoder('utf-8').decode(bytes);
      if (text.includes('전체출석율')) {
        parseSBSFormat(text, file.name);
      } else {
        setUploadStatus('❌ 지원하지 않는 형식입니다. 컴퓨터안산 .xls 파일을 올려주세요.', 'err');
      }
    } catch(err) {
      setUploadStatus('❌ 파일 오류: ' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseSBSFormat(html, filename) {
  const rows = [...html.matchAll(/<tr[^>]*>(.*?)<\/tr>/gs)].map(m => m[1]);

  // Build col->room map
  const headerRow = rows[0] || '';
  const thTags = [...headerRow.matchAll(/<th([^>]*)>(.*?)<\/th>/gs)];
  const col2room = ['TIME'];
  thTags.forEach(([, attrs, text]) => {
    const clean = text.replace(/<[^>]+>/g,'').trim();
    const cs = parseInt((attrs.match(/colspan=["']?(\d+)/) || [0,1])[1]);
    if (clean !== '강의실') for (let i=0; i<cs; i++) col2room.push(clean+'강의장');
  });

  const occupied = {};
  const timeAtRow = {};
  const raw = [];

  rows.forEach((rowHtml, ridx) => {
    if (ridx < 3) return;
    const thM = rowHtml.match(/<th[^>]*>(\d+:\d+)<\/th>/);
    if (!thM) return;
    timeAtRow[ridx] = thM[1];
    const tds = [...rowHtml.matchAll(/<td([^>]*)>(.*?)<\/td>/gs)];
    let col = 1;
    tds.forEach(([, attrs, cellHtml]) => {
      while (occupied[ridx+','+col]) col++;
      const text = cellHtml.replace(/&nbsp;/g,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      const rowspan = parseInt((attrs.match(/rowspan=["']?(\d+)/) || [0,1])[1]);
      if (text.includes('전체출석율') && col < col2room.length) {
        raw.push({ridx, col, text, rowspan});
      }
      for (let r=ridx+1; r<ridx+rowspan; r++) occupied[r+','+col] = true;
      col++;
    });
  });

  const parsed = raw.map(c => {
    const {ridx, col, text, rowspan} = c;
    const subject = text.split('전체출석율')[0].trim();
    const teacherM = text.match(/배정:\d+(?:\([^)]+\))?\s*([가-힣]+)\d*\s+(월|화|수|목|금|토|일)/);
    const teacher = teacherM ? teacherM[1]+'강사' : '';
    const daysM = text.match(/배정:\d+(?:\([^)]+\))?\s*[가-힣]*\d*\s*([\S]+)\s+개:/);
    const days = daysM ? daysM[1].trim() : '';
    const startM = text.match(/개:(\d{4}-\d{2}-\d{2})/);
    const endM = text.match(/종:(\d{4}-\d{2}-\d{2})/);
    const fmt = d => { const p=d.split('-'); return p[1]+'.'+p[2]; };
    const st = timeAtRow[ridx] || '00:00';
    const [sh, sm] = st.split(':').map(Number);
    const tot = sh*60 + sm + rowspan*30;
    const et = String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');

    // Detect if weekend (토/일 in days)
    const isWeekend = /토|일/.test(days);

    return {
      id: nextId++, subject, teacher, days, isWeekend,
      startDate: startM ? fmt(startM[1]) : '',
      endDate: endM ? fmt(endM[1]) : '',
      timeStart: st, timeEnd: et,
      room: col2room[col] || '?',
      supplies: 'X', isOnline: '대면'
    };
  });

  // Detect month from dates
  const months = [...new Set(parsed.map(c => c.startDate.split('.')[0]).filter(Boolean))];
  const monthLabel = months.length > 0 ? months[0]+'월' : '?월';

  // Split into weekday / weekend tabs
  const weekday = parsed.filter(c => !c.isWeekend);
  const weekend = parsed.filter(c => c.isWeekend);

  // Find or create tabs for this month
  const wdId = 'weekday_'+monthLabel;
  const weId = 'weekend_'+monthLabel;

  // Remove old tabs for same month, keep others
  tabs = tabs.filter(t => t.id !== wdId && t.id !== weId);

  if (weekday.length > 0) tabs.push({ id: wdId, label:'평일반', icon:'📅', month: monthLabel, courses: weekday });
  if (weekend.length > 0) tabs.push({ id: weId, label:'주말반', icon:'🗓️', month: monthLabel, courses: weekend });

  activeTab = tabs[0]?.id || 'weekday';
  selected.clear();
  renderTabs();
  applyFilters();
  setUploadStatus(`✅ "${filename}" — 평일 ${weekday.length}개 / 주말 ${weekend.length}개 강좌 로드 완료`, 'ok');
  toast(`✅ ${parsed.length}개 강좌 불러오기 완료!`);
}

function setUploadStatus(msg, cls) {
  const el = document.getElementById('upload-status');
  el.textContent = msg;
  el.className = 'upload-status ' + cls;
}

// ── SETTINGS ──
function initDcSettings() {
  document.getElementById('dc-settings').innerHTML = ROOMS.map(r => `
    <div class="dc-row">
      <label>${r}</label>
      <input type="text" id="dc-${r}" value="${DISCORD_DEF[r]}" placeholder="디스코드 링크">
    </div>`).join('');
}

function getDiscord(room) {
  const el = document.getElementById('dc-'+room);
  return el ? el.value : (DISCORD_DEF[room]||'');
}

function openSettings() {
  document.getElementById('modal-bg').classList.add('open');
}
function closeSettings(e) {
  if (!e || e.target === document.getElementById('modal-bg')) {
    document.getElementById('modal-bg').classList.remove('open');
  }
}

// ── TOAST ──
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── START ──
init();
</script>
